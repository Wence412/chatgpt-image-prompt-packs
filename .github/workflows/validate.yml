name: Validate prompt library

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/build_exports.py --check
      - run: python3 scripts/validate.py
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/import_vph.py --check

      - name: Validate visual resources
        run: python scripts/validate_media.py
